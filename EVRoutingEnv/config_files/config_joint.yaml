# Primary joint fleet-routing configuration for the IEEE T-ITS revision campaign.

problem:
  mode: joint_fleet
  payload_capacity: 20.0
  min_customer_demand: 1.0
  max_customer_demand: 4.0
  base_service_time: 0.2
  # The base campaign has no windows. Enable only in the controlled variant.
  time_windows:
    enabled: false

environment:
  num_trucks: 2
  num_stops: 10
  allow_variable_num_stops: false
  observation_mode: canonical_flat
  min_hop_distance: 10.0
  max_hop_distance: 50.0
  max_time: 200.0
  max_episode_steps: 200
  verbose: false

truck:
  battery_capacity: 400.0
  base_speed: 40.0
  initial_battery: full

charging:
  action_mode: target_soc
  target_soc_levels: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]

  # Synthetic campaign classes are assigned cyclically to sorted station IDs.
  # Use station_power_overrides_kw for empirical station-specific assignments.
  station_power_classes_kw: [150.0, 350.0, 750.0]
  station_power_overrides_kw: {}

  use_realistic_curve: true
  level2:
    charge_rate: 150.0
    efficiency: 0.90
  dcfast:
    charge_rate: 350.0
    efficiency: 0.90
    taper_start_soc: 0.8
    taper_power_min: 150.0

  # Retained only for the legacy duration-action sensitivity campaign.
  charge_durations: [0.25, 0.5, 1.0]

delivery:
  enable_flexible_delivery_order: true
  enable_stochastic_unloading: true
  base_unloading_time: 0.2
  std_dev_factor: 0.20
  max_std_dev_hours: 0.25
  business_hours_multiplier: 1.5
  min_unloading_multiplier: 0.75
  max_unloading_multiplier: 1.5

rewards:
  # Training shaping only; evaluation uses operational_metrics in episode info.
  time_multiplier: 1.0
  delivery_bonus: 500.0
  failure_penalty: -1000.0
  enable_leftover_battery_penalty: false
  leftover_battery_penalty_coef: 1.0

network:
  data_path: EVRoutingEnv/data/
  shortest_path_energy_file: shortest_path_energy_dict.json
  shortest_path_time_file: shortest_path_time_dict.json
  station_info_file: station_info_dict.json

traffic:
  enable_traffic: true
  std_dev_factor: 0.15
  max_std_dev_hours: 1.0
  rush_hour_multiplier: 2.0
  enable_energy_uncertainty: true
  energy_uncertainty_factor: 0.05
  min_energy_multiplier: 0.90
  max_energy_multiplier: 1.20
