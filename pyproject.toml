[project]
name = "evrp"
version = "0.1.0"
description = "TBD"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gymnasium>=1.1.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "scipy>=1.16.2",
    "torch>=2.9.0",
    "torch_geometric>=2.5.1",
    "tqdm>=4.67",
    "wandb>=0.22.2",
    "scikit-learn>=1.3.2",
    "networkx>=3.5",
    "pyyaml>=6.0.2",
    "dm-tree>=0.1.8",
    "contextily>=1.2.1",
    # Pinned below 13: the site licence server serves up to v12, and v13
    # rejects it with "license not valid for Gurobi version 13".
    "gurobipy>=12.0,<13",
    "seaborn>=0.12.2",
    "stable-baselines3[extra]>=1.7.0",
    "sb3-contrib>=2.3.0",
    "tensorboard>=2.15.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["EVRoutingEnv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises the environment with repository data",
]

[tool.ruff]
line-length = 88  # Same as black
target-version = "py312"
lint.extend-select = [
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
lint.extend-ignore = ["F722", "F821", "E731"]
fix = true

# Ignore files in .gitignore
respect-gitignore = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["fm_energy"]
force-single-line = false
lines-after-imports = 2
