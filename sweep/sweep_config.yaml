# Weights & Biases Hyperparameter Sweep Configuration
# Run with: wandb sweep sweep_config.yaml

program: train.py
method: bayes  # Options: grid, random, bayes
metric:
  name: eval/mean_reward
  goal: maximize

# Early termination configuration
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3
  s: 2

parameters:
  # Environment parameters
  num-trucks:
    value: 1
  num-stops:
    values: [3, 5, 7]
  max-time:
    value: 200.0
  
  # Training parameters
  max-episodes:
    value: 1000
  max-timesteps:
    value: 100000
  max-episode-steps:
    values: [150, 200, 250]
  eval-freq:
    value: 500
  batch-size:
    values: [16, 32, 64]
  start-timesteps:
    values: [200, 300, 500]
  buffer-size:
    value: 1000000
  
  # TD3 hyperparameters
  discount:
    values: [0.95, 0.99, 0.995]
  tau:
    distribution: uniform
    min: 0.001
    max: 0.01
  policy-noise:
    distribution: uniform
    min: 0.1
    max: 0.3
  noise-clip:
    values: [0.3, 0.5, 0.7]
  policy-freq:
    values: [1, 2, 4]
  expl-noise:
    distribution: uniform
    min: 0.05
    max: 0.2
  
  # Network architecture
  gnn-hidden-dim:
    values: [32, 64, 128]
  mlp-hidden-dim:
    values: [128, 256, 512]
  actor-gcn-layers:
    values: [3, 4, 5]
  critic-gcn-layers:
    values: [3, 4, 5]
  lr:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-3
  
  # Charging duration parameters
  min-charging-duration:
    values: [0.25, 0.5, 1.0]
  max-charging-duration:
    values: [8.0, 10.0, 12.0]
  
  # Fixed parameters
  seed:
    value: 42
  wandb-project:
    value: evpr-td3-gnn-sweep
