# SimpleTruckEnv Configuration File
# =================================
# This file contains all problem-specific initialization parameters
# for the electric truck routing and charging environment.

# Environment Settings
# --------------------
environment:

  # Multi-truck simulation
  num_trucks: 2

  # Number of delivery stops per truck episode
  num_stops: 3

  # Minimum energy consumption between consecutive delivery stops (kWh)
  min_hop_distance: 100.0

  # Maximum energy consumption between consecutive delivery stops (kWh)
  max_hop_distance: 400.0

  # Maximum simulation time in hours (for event-driven environments)
  max_time: 64.0

# Truck Configuration
# -------------------
truck:
  # Electric truck specifications (single type)
  battery_capacity: 400.0 # kWh
  base_speed: 40.0 # km/h

  # Initial battery level: "full", "random", or specific percentage (0-100)
  initial_battery: "full"

# Charging Configuration
# ----------------------
charging:
  # Two charger types based on input data

  # Level 2 chargers (slower, more common)
  level2:
    charge_rate: 7.2 # kW (typical Level 2 charging power)
    efficiency: 0.90 # 90% charging efficiency

  # DC Fast chargers (faster, less common)
  dcfast:
    charge_rate: 50.0 # kW (typical DC Fast charging power)
    efficiency: 0.85 # 85% charging efficiency (faster = slightly less efficient)

  # Available charging durations (hours)
  charge_durations: [1, 2, 3, 4]

# Reward Function
# ---------------
rewards:
  # Time-based reward coefficient (negative per hour spent)
  time_penalty: -1.0

  # Distance-based penalty coefficient (negative per km traveled)
  distance_penalty: -0.1

  # Charging time penalty (negative per hour charging)
  charge_penalty: -2.0

  # Bonus for completing a delivery
  delivery_bonus: 50.0

  # Bonus for completing all deliveries
  completion_bonus: 1000.0

  # Penalty for battery failure
  failure_penalty: -500.0

  # Penalty for invalid action (no path, illegal move)
  invalid_action_penalty: -10.0

  # Penalty for insufficient battery
  insufficient_battery_penalty: -50.0


# Graph/Network Settings
# -----------------------
network:
  data_path: "truck_env/data/"
  # Graph file names
  shortest_path_energy_file: "shortest_path_energy_dict.json"
  shortest_path_time_file: "shortest_path_time_dict.json"
  station_info_file: "station_info_dict.json"

# Traffic Simulation Settings
# ----------------------------
traffic:
  # Enable traffic simulation (applies normal distribution to travel times)
  enable_traffic: false
  
  # Standard deviation of travel time distribution as fraction of mean time
  # Example: std_dev_factor: 0.2 means std_dev = 0.2 * mean_time
  # Travel time ~ N(mean_time, (std_dev_factor * mean_time)^2)
  std_dev_factor: 0.15
  
  # Optionally cap the std_dev to avoid extreme values
  # Set to 0 or negative to disable capping
  max_std_dev_hours: 1.0


